name: Docker & Dart Benchmark CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  fast-dart-test:
    name: Fast Dart Benchmark Verification (~30s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: '3.12.0'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: '3.2'

      - name: Run Dart Benchmarks Directly
        run: |
          cd json
          ruby generate_json.rb
          TERM=xterm make run[target/json_dart]
          cd ../matmul
          TERM=xterm make run[target/matmul_dart] MSIZE=100

  docker-test:
    name: Full Multi-Language Docker Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image with Layer Cache
        uses: docker/build-push-action@v7
        with:
          context: docker
          load: true
          tags: kostya-benchmarks:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Language Versions
        run: docker run --rm kostya-benchmarks:latest versions

      - name: Run Dart JSON Benchmarks in Container
        run: |
          docker run --rm --entrypoint /bin/bash -v "$PWD:/src" -w /src/json kostya-benchmarks:latest -c "TERM=xterm make run[target/json_dart]"
